[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-agents-contextfetch"
version = "0.1.0"
description = "ContextFetch web search and page reading tools for the OpenAI Agents SDK"
authors = [{ name = "ContextFetch" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai-agents>=0.20.0",
    "contextfetch>=0.1.0,<1.0.0",
]

[project.urls]
Homepage = "https://contextfetch.dev"
Documentation = "https://contextfetch.dev/docs/reference"
Repository = "https://github.com/lachy3433/openai-agents-contextfetch"

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.sdist]
only-include = ["openai_agents_contextfetch", "tests", "README.md", "LICENSE"]
